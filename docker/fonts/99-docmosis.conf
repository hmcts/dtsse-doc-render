<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fedora's fonts.conf scans the X11 Type1 directory, Alpine's does not. -->
  <dir>/usr/share/X11/fonts/Type1</dir>

  <!--
    LibreOffice 7.6 (Docmosis) takes the first usable family fontconfig lists after the one a document asks for.
    LibreOffice 25.8 only does so when the list is explicit about it, and otherwise falls back to Noto Serif, so a
    document in ArialMT, Aptos or Helvetica Neue is set in a serif font. Naming Noto Sans right after the requested
    family restores the sans fallback, and the rules below it name what 7.6 picks for the families fontconfig
    classes differently: system-ui, serif and monospace names and the metric aliases.
  -->
  <match target="pattern">
    <test name="family" qual="any" compare="not_eq"><string>-</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Garamond</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Elephant</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>MS Serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Thorndale AMT</string></test>
    <edit name="family" mode="append" binding="weak"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Thorndale</string></test>
    <edit name="family" mode="append" binding="weak"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Nimbus Roman</string></test>
    <edit name="family" mode="append" binding="weak"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Nimbus Roman No9 L</string></test>
    <edit name="family" mode="append" binding="weak"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Bitstream Vera Serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Luxi Serif</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Times</string></test>
    <edit name="family" mode="append" binding="weak"><string>Times New Roman</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Palatino Linotype</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>SimSun</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Courier</string></test>
    <edit name="family" mode="append" binding="weak"><string>Courier New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Courier Std</string></test>
    <edit name="family" mode="append" binding="weak"><string>Courier New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Nimbus Mono L</string></test>
    <edit name="family" mode="append" binding="weak"><string>Courier New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Fixedsys</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Terminal</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Inconsolata</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Bitstream Vera Sans Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Luxi Mono</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Cumberland</string></test>
    <edit name="family" mode="append" binding="weak"><string>Courier New</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Segoe UI Historic</string></test>
    <edit name="family" mode="append" binding="weak"><string>Cantarell</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Segoe UI</string></test>
    <edit name="family" mode="append" binding="weak"><string>Cantarell</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Segoe UI Symbol</string></test>
    <edit name="family" mode="append" binding="weak"><string>Cantarell</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Noto Sans UI</string></test>
    <edit name="family" mode="append" binding="weak"><string>Cantarell</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Helvetica LT Std</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Helvetica</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Albany</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Arimo</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Nimbus Sans L</string></test>
    <edit name="family" mode="append" binding="weak"><string>Arial</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Zapfino</string></test>
    <edit name="family" mode="append" binding="weak"><string>Comic Sans MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Bauhaus Std</string></test>
    <edit name="family" mode="append" binding="weak"><string>Impact</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>ITC Zapf Chancery Std</string></test>
    <edit name="family" mode="append" binding="weak"><string>Comic Sans MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Cooper Std</string></test>
    <edit name="family" mode="append" binding="weak"><string>Impact</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>Copperplate Gothic Std</string></test>
    <edit name="family" mode="append" binding="weak"><string>Impact</string></edit>
  </match>
</fontconfig>
